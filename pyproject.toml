[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.1.0"
description = "Personal financial dashboard — Plaid + Textual"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.60.0",
    "plaid-python>=18.0.0",
    "python-dotenv>=1.0.0",
    "keyring>=24.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
ledger = "ledger.app:run"